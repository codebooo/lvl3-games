<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LVL³ — Archiv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="/js/theme.js?v=8"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#000;overflow:hidden}
    body{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;cursor:none}
    canvas{display:block}
    #lv-scroll::-webkit-scrollbar{width:0}
    @keyframes lvspin{to{transform:rotate(360deg)}}
    @media(hover:none){body{cursor:auto}}

    /* ── Responsive: tablet ≤900px ── (desktop look is unchanged above this) */
    @media(max-width:900px){
      #top-bar{padding:18px 18px}
      #bottom-bar{padding:18px 18px}
      #header-subtitle{max-width:240px;font-size:10px}
      #lv-nav{padding:18px 18px}
      /* detail panel: tighten the two-column layout before it stacks */
      .detail-grid{gap:36px;padding:36px}
      .detail-content p{max-width:none}
    }

    /* ── Responsive: phone ≤640px ── */
    @media(max-width:640px){
      /* HEADER: hide the long centered subtitle, keep brand + gear + logout reachable */
      #top-bar{padding:14px 14px;align-items:center;gap:10px}
      #header-subtitle{display:none}
      #top-bar > div:first-child{gap:14px}
      #sound-label{display:none}            /* keep the eq icon, drop the text */
      #counter{display:none}                 /* 09/09 counter — drop on phones */
      #top-bar > div:last-child{gap:10px}
      #logout-btn{padding:7px 12px;letter-spacing:.12em}

      /* FOOTER: restack the 1fr auto 1fr grid so chips stay tappable.
         Row 1: filter chips (full width, centered, horizontally scrollable).
         Row 2: view-toggle (left) + leaderboard (right). */
      #bottom-bar{
        grid-template-columns:1fr 1fr;
        grid-template-areas:"chips chips" "toggle lb";
        gap:12px;
        padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
      }
      #bottom-bar > #view-toggle{grid-area:toggle;justify-self:start}
      #bottom-bar > #chips{
        grid-area:chips;justify-self:stretch!important;justify-content:flex-start;
        overflow-x:auto;-webkit-overflow-scrolling:touch;
        scrollbar-width:none;
      }
      #bottom-bar > #chips::-webkit-scrollbar{height:0;width:0}
      #bottom-bar > div:last-child{grid-area:lb;justify-self:end}
      #drag-hint{display:none}               /* hide "ZIEHEN ZUM ERKUNDEN" on phones */

      /* LIST-VIEW NAV: same restack as the footer */
      #lv-nav{
        grid-template-columns:1fr 1fr;
        grid-template-areas:"chips chips" "back lb";
        gap:12px;
        padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
      }
      #lv-nav > #lv-back{grid-area:back;justify-self:start;padding:9px 14px}
      #lv-nav > #lv-chips{
        grid-area:chips;justify-self:stretch!important;justify-content:flex-start;
        overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
      }
      #lv-nav > #lv-chips::-webkit-scrollbar{height:0;width:0}
      #lv-nav > #lv-lb{grid-area:lb;justify-self:end;padding:9px 14px}

      /* LIST-VIEW scroll padding: leave room for the taller restacked nav */
      #lv-scroll{padding:96px 16px 140px}

      /* DETAIL PANEL: stack to a single column, top-align + scroll if tall.
         #detail carries an inline display:flex, so override with !important. */
      #detail{display:block!important;overflow-y:auto;-webkit-overflow-scrolling:touch}
      .detail-grid{
        grid-template-columns:1fr;
        gap:24px;
        padding:64px 18px calc(28px + env(safe-area-inset-bottom,0px));
        width:auto;
        margin:0;
        align-items:stretch;
      }
      .detail-poster-col{max-width:340px;margin:0 auto;width:100%}
      .detail-content p{max-width:none}
      .detail-x{top:14px;right:14px;width:40px;height:40px}

      /* OVERLAYS: reduce padding so content fits at 390px */
      #lb-scroll{padding:72px 16px 60px}
      #settings-overlay > div{padding:72px 16px 60px}
      #accent-swatches{gap:10px}
    }
  </style>
</head>
<body>
<div id="app" style="position:fixed;inset:0;background:#000;color:#fff;overflow:hidden;user-select:none">

  <div id="gl-mount" style="position:absolute;inset:0;z-index:1"></div>

  <!-- vignette — strong radial darkening around edges -->
  <div style="position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(110% 110% at 50% 50%, transparent 22%, rgba(0,0,0,.52) 68%, rgba(0,0,0,.96) 100%)"></div>

  <!-- loader -->
  <div id="loader" style="position:absolute;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px">
    <div style="width:26px;height:26px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:lvspin .8s linear infinite"></div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.32em;color:rgba(255,255,255,.5)">LADE ARCHIV</div>
  </div>

  <!-- top bar -->
  <header id="top-bar" style="position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;padding:26px 30px;pointer-events:none">
    <div style="display:flex;align-items:center;gap:30px">
      <div id="brand" style="pointer-events:auto;cursor:pointer;font-weight:700;font-size:23px;letter-spacing:.02em;line-height:1">LVL<span style="color:#ff2244">³</span></div>
      <button id="sound-btn" style="pointer-events:auto;background:none;border:none;color:rgba(255,255,255,.62);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 0">
        <span id="sound-eq" style="display:inline-flex;align-items:flex-end;gap:2px;height:12px">
          <i style="width:2px;height:4px;background:currentColor;display:block;transition:height .3s"></i>
          <i style="width:2px;height:9px;background:currentColor;display:block;transition:height .3s"></i>
          <i style="width:2px;height:6px;background:currentColor;display:block;transition:height .3s"></i>
        </span>
        <span id="sound-label">SOUND [AUS]</span>
      </button>
    </div>
    <div id="header-subtitle" style="max-width:340px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.65;letter-spacing:.04em;color:rgba(255,255,255,.55);text-transform:uppercase;text-align:center">LVL³ — ein privates Party-Spiele-Archiv für Marlin, Oskar, David &amp; Bosse.</div>
    <div style="display:flex;align-items:center;gap:18px">
      <div id="counter" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.55)">12 / 12</div>
      <button id="settings-btn" title="Akzentfarbe" style="pointer-events:auto;background:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.62);cursor:pointer;padding:7px 9px;display:flex;align-items:center;justify-content:center;transition:border-color .25s,color .25s">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="logout-btn" style="pointer-events:auto;background:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.62);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;cursor:pointer;padding:7px 15px;transition:border-color .25s,color .25s">LOGOUT</button>
    </div>
  </header>

  <!-- bottom bar -->
  <footer id="bottom-bar" style="position:absolute;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:26px 30px;pointer-events:none">
    <div id="view-toggle" style="justify-self:start;pointer-events:auto;display:flex;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px">
      <button data-view="sphere" class="vt-btn" style="width:34px;height:30px;border-radius:999px;border:none;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,color .25s">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button data-view="list" class="vt-btn" style="width:34px;height:30px;border-radius:999px;border:none;background:transparent;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,color .25s">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
    <div id="chips" style="justify-self:center;pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(14,14,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px"></div>
    <div style="justify-self:end;display:flex;align-items:center;gap:14px">
      <div id="drag-hint" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:10px;transition:opacity .4s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        ZIEHEN ZUM ERKUNDEN
      </div>
      <button id="lb-btn" style="pointer-events:auto;background:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.62);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;cursor:pointer;padding:7px 15px;transition:border-color .25s,color .25s">LEADERBOARD</button>
    </div>
  </footer>

  <!-- detail panel -->
  <div id="detail" style="position:absolute;inset:0;z-index:20;display:flex;opacity:0;pointer-events:none;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)"></div>

  <!-- list view -->
  <div id="listview" style="position:absolute;inset:0;z-index:15;opacity:0;pointer-events:none;visibility:hidden;background:#000">
    <div id="lv-scroll" style="position:absolute;inset:0;overflow-y:auto;padding:120px 30px 110px">
      <div id="lv-rows" style="max-width:1180px;margin:0 auto"></div>
    </div>
    <!-- list-view nav bar: back to sphere + filter chips + leaderboard
         (the global footer is hidden behind this overlay, so we mirror it here) -->
    <div id="lv-nav" style="position:absolute;bottom:0;left:0;right:0;z-index:16;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 30px;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,0))">
      <button id="lv-back" style="justify-self:start;pointer-events:auto;background:rgba(14,14,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.78);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;cursor:pointer;padding:9px 17px;display:flex;align-items:center;gap:9px;transition:border-color .25s,color .25s">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        SPHÄRE
      </button>
      <div id="lv-chips" style="justify-self:center;pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(14,14,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px"></div>
      <button id="lv-lb" style="justify-self:end;pointer-events:auto;background:rgba(14,14,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.78);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;cursor:pointer;padding:9px 17px;transition:border-color .25s,color .25s">LEADERBOARD</button>
    </div>
  </div>

  <!-- leaderboard overlay -->
  <div id="lb-overlay" style="position:absolute;inset:0;z-index:25;opacity:0;pointer-events:none;visibility:hidden;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)">
    <div id="lb-scroll" style="position:absolute;inset:0;overflow-y:auto;padding:90px 30px 80px">
      <div style="max-width:760px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px;margin-bottom:10px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.85)">LEADERBOARD</div>
          <button id="lb-close" style="background:none;border:none;color:rgba(255,255,255,.5);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;cursor:pointer;display:flex;align-items:center;gap:8px">ESC · SCHLIESSEN
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style="display:grid;grid-template-columns:50px 44px 1fr auto;gap:18px;align-items:center;padding:8px 4px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.32)">
          <div>RANG</div><div></div><div>SPIELER</div><div style="text-align:right">SIEGE · PUNKTE</div>
        </div>
        <div id="lb-rows"></div>
      </div>
    </div>
  </div>

  <!-- settings overlay: accent-palette picker (phantom style, like leaderboard) -->
  <div id="settings-overlay" style="position:absolute;inset:0;z-index:26;opacity:0;pointer-events:none;visibility:hidden;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)">
    <div style="position:absolute;inset:0;overflow-y:auto;padding:90px 30px 80px">
      <div style="max-width:560px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px;margin-bottom:26px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.85)">EINSTELLUNGEN</div>
          <button id="settings-close" style="background:none;border:none;color:rgba(255,255,255,.5);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;cursor:pointer;display:flex;align-items:center;gap:8px">ESC · SCHLIESSEN
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:16px">Akzentfarbe</div>
        <div id="accent-swatches" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"></div>

        <!-- Profilbild -->
        <div style="border-top:1px solid rgba(255,255,255,.1);margin-top:34px;padding-top:26px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.85);margin-bottom:18px">PROFILBILD</div>
          <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
            <div id="avatar-preview-wrap" style="display:none">
              <img id="avatar-preview" src="" alt="Profilbild Vorschau" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.2);display:block">
            </div>
            <div style="flex:1;min-width:180px">
              <label for="avatar-file-input" style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:10px">Bild auswählen (max. 10 MB)</label>
              <input id="avatar-file-input" type="file" accept="image/*" style="display:block;width:100%;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer">
              <div id="avatar-upload-error" style="color:var(--acc,#ff2244);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;min-height:18px;margin-top:8px"></div>
            </div>
          </div>
        </div>

        <!-- Konto -->
        <div style="border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:26px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.85);margin-bottom:18px">KONTO</div>
          <form id="settings-pw-form">
            <label for="set-new-pw" style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px">Neues Passwort</label>
            <input id="set-new-pw" type="password" autocomplete="new-password" placeholder="Mindestens 6 Zeichen"
              style="width:100%;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.18);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:16px;padding:10px 2px;border-radius:0;outline:none;margin-bottom:18px">
            <label for="set-confirm-pw" style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px">Passwort bestätigen</label>
            <input id="set-confirm-pw" type="password" autocomplete="new-password" placeholder="Nochmal eingeben"
              style="width:100%;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.18);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:16px;padding:10px 2px;border-radius:0;outline:none;margin-bottom:16px">
            <div id="set-pw-error" style="color:var(--acc,#ff2244);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;min-height:18px;margin-bottom:14px"></div>
            <button type="submit" style="background:#fff;color:#000;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:1px solid #fff;border-radius:999px;padding:12px 26px;cursor:pointer;transition:transform .2s">Passwort ändern</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- custom cursor dot -->
  <div id="cursor" style="position:fixed;top:0;left:0;z-index:50;pointer-events:none;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1)"></div>
  <div id="cursor-ring" style="position:fixed;top:0;left:0;z-index:49;pointer-events:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.38);transform:translate(-50%,-50%) scale(.4);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s"></div>
  <div id="cursor-label" style="position:fixed;top:0;left:0;z-index:50;pointer-events:none;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;color:#fff;transform:translate(-50%,28px);opacity:0;transition:opacity .25s;mix-blend-mode:difference"></div>
</div>

<!-- Auth gate: redirects to / if not logged in (or password not yet changed). -->

    const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};
    const pickTile=(cx,cy)=>{const r=dom.getBoundingClientRect();ndc.x=((cx-r.left)/r.width)*2-1;ndc.y=-((cy-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);const d=ray.ray.direction.clone().normalize();if(-d.z<=0)return null;const lat=Math.asin(Math.max(-1,Math.min(1,d.y)));const lon=Math.atan2(d.x,-d.z);let best=null,bestScore=1e9;for(const t of tiles){const dlat=Math.abs(lat-t.curLat),dlon=Math.abs(angDiff(lon,t.curLon))*Math.cos(t.curLat);if(dlat<latStep*.5&&dlon<lonSpan*.5){const s=dlat+dlon;if(s<bestScore){bestScore=s;best=t;}}}return best;};

    let hovered=null;
    const hoverTest=(cx,cy)=>{const t=pickTile(cx,cy);if(t!==hovered){if(hovered)gsap.to(hovered.mat.uniforms.uHover,{value:0,duration:.4});hovered=t;if(t)gsap.to(t.mat.uniforms.uHover,{value:1,duration:.4});}setCursorState(t?'view':'idle');};

    const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring'),clab=document.getElementById('cursor-label');
    const cursorXY=(cx,cy)=>{cur.style.left=cx+'px';cur.style.top=cy+'px';clab.style.left=cx+'px';clab.style.top=cy+'px';};
    const setCursorState=(state)=>{if(state==='view'){ring.style.opacity='1';ring.style.transform='translate(-50%,-50%) scale(1)';cur.style.width='6px';cur.style.height='6px';clab.style.opacity='1';clab.textContent='ÖFFNEN';}else if(state==='grab'){ring.style.opacity='1';ring.style.transform='translate(-50%,-50%) scale(.72)';cur.style.width='5px';cur.style.height='5px';clab.style.opacity='1';clab.textContent='ZIEHEN';}else{ring.style.opacity='0';ring.style.transform='translate(-50%,-50%) scale(.4)';cur.style.width='9px';cur.style.height='9px';clab.style.opacity='0';}};
    setCursorStateRef=setCursorState;

    const clock=new THREE.Clock();
    const renderLoop=()=>{
      raf=requestAnimationFrame(renderLoop);
      const dt=clock.getDelta(),tt=clock.elapsedTime;
      if(!dragging&&!sceneDetailOpen){
        tLon+=vLon;tLat+=vLat;
        vLon*=.94;vLat*=.92;
        if(Math.abs(vLon)<1e-5)vLon=0;if(Math.abs(vLat)<1e-5)vLat=0;
        idle+=dt;
        if(autoRotate&&idle>3&&!vLon&&!listOpen)tLon-=6e-4;
      }
      const pLon=sLon;
      sLon+=(tLon-sLon)*.085;sLat+=(tLat-sLat)*.085;
      updateTiles(sLon,sLat);
      for(const t of tiles)t.mat.uniforms.uTime.value=tt+t.curLon;
      if(sound)sound.setIntensity(Math.min(1,Math.abs(sLon-pLon)*120));
      renderer.render(scene,camera);
    };
    renderLoop();

    window.addEventListener('resize',()=>{const w=mount.clientWidth,h=mount.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);});

    three={THREE,gsap,camera,tiles,RADIUS,setYawPitch:(y,p)=>{tLon=y;tLat=p;vLon=0;vLat=0;},focusTile:(t)=>{tLon=t.gridCol*lonSpan;tLat=t.gridRow*latStep;vLon=0;vLat=0;},setDetail:(v)=>{sceneDetailOpen=v;},setList:(v)=>{listOpen=v;if(hovered){gsap.to(hovered.mat.uniforms.uHover,{value:0,duration:.3});hovered=null;}}};

    buildChips();buildList();wireChrome();

    gsap.to('#loader',{opacity:0,duration:.6,delay:.15,onComplete:()=>{const l=document.getElementById('loader');if(l)l.style.display='none';}});
    gsap.from('header > div, footer > *',{y:-12,opacity:0,duration:.8,stagger:.06,delay:.3,ease:'power3.out'});
    setTimeout(()=>{const l=document.getElementById('loader');if(l){l.style.transition='opacity .5s';l.style.opacity='0';setTimeout(()=>{if(l)l.style.display='none';},520);}},1100);
  }

  // ── Animated detail poster (was this.startDetailPoster) ──
  function startDetailPoster(hue){
    const cv=document.getElementById('detail-poster');if(!cv)return;
    const x=cv.getContext('2d'),W=cv.width,H=cv.height;let t=0;
    const draw=()=>{
      posterRaf=requestAnimationFrame(draw);t+=.006;
      const g1=x.createLinearGradient(0,0,W,H);
      g1.addColorStop(0,`hsl(${hue} 70% 11%)`);
      g1.addColorStop(.5,`hsl(${(hue+18)%360} 80% ${36+Math.sin(t)*6}%)`);
      g1.addColorStop(1,`hsl(${(hue-12+360)%360} 85% 14%)`);
      x.fillStyle=g1;x.fillRect(0,0,W,H);
      for(let i=0;i<3;i++){
        const cx=W*(.5+.32*Math.sin(t*.7+i*2.1)),cy=H*(.5+.32*Math.cos(t*.9+i*1.7));
        const r=W*(.34+.08*Math.sin(t+i));
        const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
        rg.addColorStop(0,`hsla(${(hue+i*22)%360} 95% 65% / .4)`);rg.addColorStop(1,'hsla(0 0% 0% / 0)');
        x.fillStyle=rg;x.fillRect(0,0,W,H);
      }
      x.globalAlpha=.04;
      for(let i=0;i<260;i++){x.fillStyle=Math.random()>.5?'#fff':'#000';x.fillRect(Math.random()*W,Math.random()*H,2,2);}
      x.globalAlpha=1;
    };draw();
  }

      lvBack.addEventListener('mouseleave',()=>{lvBack.style.borderColor='rgba(255,255,255,.16)';lvBack.style.color='rgba(255,255,255,.78)';});

    onKey=(e)=>{if(e.key==='Escape'){if(settingsOpen)closeSettings();else if(lbOpen)closeLeaderboard();else if(detailOpen)closeDetail();else setView('sphere');}};

  // ── Ambient drone toggle (was this.toggleSound) ──
  function toggleSound(){
    const lbl=document.getElementById('sound-label'),eq=document.getElementById('sound-eq');
    if(!sound){
      try{
        const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),master=ctx.createGain();
        master.gain.value=0;master.connect(ctx.destination);
        const o1=ctx.createOscillator(),o2=ctx.createOscillator();
        o1.type='sine';o1.frequency.value=55;o2.type='sine';o2.frequency.value=82.5;
        const og=ctx.createGain();og.gain.value=.5;o1.connect(og);o2.connect(og);
        const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;og.connect(lp);lp.connect(master);
        o1.start();o2.start();
        sound={ctx,master,on:true,base:.012,setIntensity:(v)=>{if(!sound||!sound.on)return;sound.master.gain.setTargetAtTime(sound.base+v*.05,sound.ctx.currentTime,.2);}};
      }catch(e){return;}
    }else{
      sound.on=!sound.on;
      if(!sound.on)sound.master.gain.setTargetAtTime(0,sound.ctx.currentTime,.15);
    }
    const on=sound&&sound.on;
    lbl.textContent=on?'SOUND [AN]':'SOUND [AUS]';
    eq.style.color=on?'#ff2244':'currentColor';
    eq.querySelectorAll('i').forEach((b,i)=>{b.style.height=on?[9,5,11][i]+'px':[4,9,6][i]+'px';});
  }

  // ── Leaderboard overlay (was this.openLeaderboard / closeLeaderboard) ──
  function lbInitial(name){
    if(!name)return '?';
    const n=String(name).trim();
    return n.charAt(0).toUpperCase();
  }
  function lbAvatar(name,leader){
    const initial=lbInitial(name);
    const bg=leader?'#ff2244':'rgba(255,255,255,.08)';
    const col=leader?'#fff':'rgba(255,255,255,.78)';
    return `<div style="width:38px;height:38px;border:1px solid rgba(255,255,255,.14);background:${bg};color:${col};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500">${initial}</div>`;
  }
  function renderLeaderboardRows(rows){
    const box=document.getElementById('lb-rows');
    box.innerHTML='';
    if(!rows||!rows.length){
      box.innerHTML='<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.4);padding:48px 4px;text-align:center">Noch keine Einträge.</div>';
      return;
    }
    rows.forEach((r,i)=>{
      const leader=i===0;
      const rankColor=leader?'#ff2244':'rgba(255,255,255,.35)';
      const nameColor=leader?'#fff':'rgba(255,255,255,.86)';
      const row=document.createElement('div');
      row.style.cssText='display:grid;grid-template-columns:50px 44px 1fr auto;gap:18px;align-items:center;padding:18px 4px;border-bottom:1px solid rgba(255,255,255,.1)';
      row.innerHTML=`<div style="font-family:'JetBrains Mono',monospace;font-size:15px;color:${rankColor}">${String(i+1).padStart(2,'0')}</div>${lbAvatar(r.username,leader)}<div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:500;letter-spacing:-.01em;color:${nameColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.username)}</div><div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.5);text-align:right;white-space:nowrap">${r.wins} S · ${r.points} P</div>`;
      box.appendChild(row);
    });
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function openLeaderboard(){
    if(lbOpen)return;
    lbOpen=true;
    const gsap=window.gsap;
    const el=document.getElementById('lb-overlay');
    const rowsEl=document.getElementById('lb-rows');
    rowsEl.innerHTML='<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.4);padding:48px 4px;text-align:center">Leaderboard wird geladen…</div>';
    el.style.visibility='visible';
    el.style.pointerEvents='auto';
    if(setCursorStateRef)setCursorStateRef('idle');
    fetch('/api/leaderboard',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('http');return r.json();}).then(data=>{
      const list=(data&&Array.isArray(data.overall))?data.overall:[];
      renderLeaderboardRows(list);
    }).catch(()=>{
      rowsEl.innerHTML='<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.4);padding:48px 4px;text-align:center">Konnte Leaderboard nicht laden</div>';
    });
    gsap.set(el,{opacity:0});gsap.to(el,{opacity:1,duration:.5,ease:'power3.out'});
    gsap.from('#lb-rows > *',{y:18,opacity:0,duration:.6,stagger:.05,delay:.12,ease:'power3.out'});
  }
  function closeLeaderboard(){
    if(!lbOpen)return;
    lbOpen=false;
    const gsap=window.gsap,el=document.getElementById('lb-overlay');
    gsap.to(el,{opacity:0,duration:.4,ease:'power2.in',onComplete:()=>{el.style.pointerEvents='none';el.style.visibility='hidden';}});
  }

  // ── Accent-palette swatches (addition 2) ──
  function renderAccentSwatches(){
    const box=document.getElementById('accent-swatches');
    if(!box)return;
    const cur=getAccent().toLowerCase();
    box.innerHTML='';
    ACCENTS.forEach(a=>{
      const active=a.hex.toLowerCase()===cur;
      const b=document.createElement('button');
      b.dataset.hex=a.hex;
      b.style.cssText='pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:11px;background:rgba(255,255,255,'+(active?'.07':'.02')+');border:1px solid '+(active?a.hex:'rgba(255,255,255,.12)')+';border-radius:14px;padding:18px 10px;cursor:pointer;transition:border-color .2s,background .2s';
      b.innerHTML='<span style="width:46px;height:46px;border-radius:50%;background:'+a.hex+';box-shadow:0 0 0 '+(active?'3px rgba(255,255,255,.9)':'0 transparent')+', 0 6px 22px '+a.hex+'55"></span>'
        +'<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:.18em;color:'+(active?'#fff':'rgba(255,255,255,.55)')+'">'+a.name+'</span>'
        +(active?'<span style="font-family:\'JetBrains Mono\',monospace;font-size:8px;letter-spacing:.2em;color:'+a.hex+'">AKTIV</span>':'<span style="font-size:8px;letter-spacing:.2em;color:transparent">—</span>');
      b.addEventListener('click',()=>setAccent(a.hex));
      box.appendChild(b);
    });
  }
  function openSettings(){
    if(settingsOpen)return;
    settingsOpen=true;
    const gsap=window.gsap,el=document.getElementById('settings-overlay');
    renderAccentSwatches();
    el.style.visibility='visible';
    el.style.pointerEvents='auto';
    if(setCursorStateRef)setCursorStateRef('idle');
    gsap.set(el,{opacity:0});gsap.to(el,{opacity:1,duration:.45,ease:'power3.out'});
    gsap.from('#accent-swatches > *',{y:16,opacity:0,duration:.5,stagger:.04,delay:.1,ease:'power3.out'});
  }
  function closeSettings(){
    if(!settingsOpen)return;
    settingsOpen=false;
    const gsap=window.gsap,el=document.getElementById('settings-overlay');
    gsap.to(el,{opacity:0,duration:.4,ease:'power2.in',onComplete:()=>{el.style.pointerEvents='none';el.style.visibility='hidden';}});
  }

  // ── Account: change password (restored) ──
  const pwForm=document.getElementById('settings-pw-form');
  if(pwForm){
    pwForm.addEventListener('submit',function(e){
      e.preventDefault();
      const newPw=document.getElementById('set-new-pw').value;
      const confirmPw=document.getElementById('set-confirm-pw').value;
      const err=document.getElementById('set-pw-error');
      err.textContent='';
      if(newPw.length<6){err.textContent='Das Passwort muss mindestens 6 Zeichen lang sein.';return;}
      if(newPw!==confirmPw){err.textContent='Die Passwörter stimmen nicht überein.';return;}
      const btn=this.querySelector('button[type=submit]');
      btn.disabled=true;btn.textContent='Speichern…';
      fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:newPw})})
        .then(r=>r.json()).then(data=>{
          btn.disabled=false;btn.textContent='Passwort ändern';
          if(data.success){
            document.getElementById('set-new-pw').value='';
            document.getElementById('set-confirm-pw').value='';
            closeSettings();
            if(window.lvl3&&window.lvl3.showToast)window.lvl3.showToast('Passwort geändert.','success');
          }else{err.textContent=data.error||'Fehler beim Ändern des Passworts.';}
        }).catch(()=>{btn.disabled=false;btn.textContent='Passwort ändern';err.textContent='Verbindungsfehler. Bitte erneut versuchen.';});
    });
  }

  // ── Profilbild: avatar upload (restored) ──
  const avatarInput=document.getElementById('avatar-file-input');
  if(avatarInput){
    avatarInput.addEventListener('change',function(e){
      const file=e.target.files&&e.target.files[0];
      if(!file)return;
      const errEl=document.getElementById('avatar-upload-error');
      errEl.textContent='';
      if(file.size>10*1024*1024){errEl.textContent='Bild zu groß. Maximal 10 MB erlaubt.';e.target.value='';return;}
      const reader=new FileReader();
      reader.onload=function(ev){
        const img=new Image();
        img.onload=function(){
          const size=256,canvas=document.createElement('canvas');
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext('2d');
          const scale=Math.max(size/img.naturalWidth,size/img.naturalHeight);
          const drawW=img.naturalWidth*scale,drawH=img.naturalHeight*scale;
          ctx.drawImage(img,(size-drawW)/2,(size-drawH)/2,drawW,drawH);
          const dataURL=canvas.toDataURL('image/jpeg',0.85);
          const pw=document.getElementById('avatar-preview-wrap');
          document.getElementById('avatar-preview').src=dataURL;
          pw.style.display='block';
          fetch('/api/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataURL})})
            .then(r=>r.json()).then(data=>{
              if(data.success){
                const av=document.getElementById('user-avatar');
                if(av){av.style.backgroundImage="url('"+(data.avatar||dataURL)+"')";av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';}
                if(window.lvl3&&window.lvl3.showToast)window.lvl3.showToast('Profilbild aktualisiert.','success');
              }else{errEl.textContent=data.error||'Fehler beim Hochladen.';}
            }).catch(()=>{errEl.textContent='Verbindungsfehler. Bitte erneut versuchen.';});
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ── Cleanup on navigation away (was this.componentWillUnmount) ──
  window.addEventListener('beforeunload',()=>{
    if(raf)cancelAnimationFrame(raf);
    if(posterRaf)cancelAnimationFrame(posterRaf);
    if(onKey)window.removeEventListener('keydown',onKey);
    if(lenis)lenis.destroy();
  });

  // ── Boot: wait for THREE + gsap + fonts, then build the scene ──
  function boot(){
    const wait=()=>new Promise(res=>{const t=()=>{if(window.THREE&&window.gsap&&document.fonts)document.fonts.ready.then(()=>res());else setTimeout(t,40);};t();});
    wait().then(()=>init());
  }

  // ── Auth gate: checkAuth redirects to "/" itself when not logged in
  //    or password not yet changed; we only boot the launcher on success. ──
  window.lvl3.checkAuth(function () {
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',boot);
    }else{
      boot();
    }
  });
})();
</script>
</body>
</html>
