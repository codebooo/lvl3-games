<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wissens-Quiz – Lvl 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=2">
  <link rel="stylesheet" href="/css/games.css?v=2">
  <script src="/js/theme.js"></script>
  <style>
    .game-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;min-height:calc(100vh - 72px);padding:20px;max-width:1100px;margin:0 auto}
    @media(max-width:700px){.game-layout{grid-template-columns:1fr}.sidebar{display:none}}
    .page-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;background:var(--surface);border-bottom:2px solid var(--border-thick);position:sticky;top:0;z-index:20}
    .sidebar{display:flex;flex-direction:column;gap:16px}
    .room-code-box{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;border:1px solid var(--border)}
    .room-code-box .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:6px}
    .room-code-box .code{font-size:32px;font-weight:900;letter-spacing:6px;color:var(--accent)}
    .main-panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:520px}
    .screen{display:none;padding:32px;flex:1;flex-direction:column;align-items:center;justify-content:center}
    .screen.active{display:flex}
    .timer-bar-wrap{height:5px;background:rgba(255,255,255,0.07);position:absolute;top:0;left:0;right:0}
    .timer-bar{height:100%;background:var(--accent);transition:width 1s linear;border-radius:0 3px 3px 0}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
    @media(max-width:480px){.settings-grid{grid-template-columns:1fr}}
    .setting-block label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
    .kq-category{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--accent3);background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.25);border-radius:20px;padding:3px 12px;margin-bottom:16px}
    .kq-question{font-size:22px;font-weight:700;line-height:1.5;text-align:center;max-width:640px;margin:0 auto 28px}
    .kq-reveal{text-align:center;font-size:16px;font-weight:700;padding:12px 24px;border-radius:var(--radius-sm);margin-bottom:20px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:var(--green);max-width:560px;width:100%}
    .kq-reveal.nobody{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3);color:var(--red)}
    .answer-row{display:flex;gap:8px;width:100%;max-width:500px}
    .typing-hint{font-size:13px;color:var(--text-muted);text-align:center;margin-top:8px}
    .text-dim{color:var(--text-dim)}
    .flex{display:flex}
    .items-center{align-items:center}
    .mt-4{margin-top:16px}
    .hidden{display:none!important}
    .options-grid .option-btn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
    .option-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);font-size:13px;font-weight:700;flex-shrink:0}
    .option-btn.selected .option-letter{background:rgba(255,255,255,0.2)}
    .option-btn.correct .option-letter{background:rgba(34,197,94,0.3)}
    .option-btn.wrong .option-letter{background:rgba(239,68,68,0.3)}
  </style>
</head>
<body>

<div class="page-header">
  <a href="/dashboard.html" class="logo-text">LVL<span>³</span></a>
  <div class="flex items-center gap-4">
    <span style="color:var(--text-dim);font-size:13px;text-transform:uppercase;letter-spacing:1px">Wissens-Quiz</span>
    <div class="flex items-center gap-2">
      <div id="user-avatar" class="player-avatar" style="width:30px;height:30px;font-size:12px;border:2px solid var(--border-thick)"></div>
      <span id="user-name" style="font-weight:700;font-size:14px"></span>
    </div>
    <button onclick="leaveRoom()" class="btn btn-secondary btn-sm">Verlassen</button>
  </div>
</div>

<div class="game-layout">

  <aside class="sidebar">
    <div class="room-code-box">
      <div class="label">Raum-Code</div>
      <div class="code" id="room-code-display">––––</div>
    </div>
    <div class="card" style="padding:20px;flex:1">
      <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);margin-bottom:12px">Spieler</div>
      <ul class="player-list" id="player-list"></ul>
    </div>
  </aside>

  <main class="main-panel">
    <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>

    <!-- ── Join ── -->
    <div class="screen active" id="screen-join">
      <div style="max-width:360px;width:100%;text-align:center">
        <h2 style="font-size:24px;margin-bottom:8px">Wissens-Quiz</h2>
        <p class="text-dim" style="margin-bottom:28px;font-size:14px">Allgemeinwissen vom Feinsten</p>
        <div style="display:flex;flex-direction:column;gap:12px">
          <button onclick="createRoom()" class="btn btn-primary btn-full">Raum erstellen</button>
          <div style="display:flex;gap:8px">
            <input id="join-code-input" class="input-field" placeholder="Code eingeben" maxlength="4"
              style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:700">
            <button onclick="joinRoom()" class="btn btn-secondary" style="white-space:nowrap">Beitreten</button>
          </div>
          <div id="join-error" style="color:var(--red);font-size:13px;min-height:18px"></div>
        </div>
      </div>
    </div>

    <!-- ── Lobby ── -->
    <div class="screen" id="screen-lobby">
      <div style="max-width:460px;width:100%">
        <div style="text-align:center;margin-bottom:28px">
          <h2 style="font-size:22px">Lobby</h2>
        </div>
        <div id="settings-panel">
          <div class="settings-grid">
            <div class="setting-block">
              <label>Schwierigkeit</label>
              <select id="sel-difficulty" class="input-field" onchange="pushSettings()">
                <option value="easy">Easy – 20s</option>
                <option value="normal" selected>Normal – 15s</option>
                <option value="hard">Hard – 10s</option>
              </select>
            </div>
            <div class="setting-block">
              <label>Spielmodus</label>
              <select id="sel-mode" class="input-field" onchange="pushSettings()">
                <option value="mc" selected>Multiple Choice</option>
                <option value="typing">Freitext</option>
              </select>
            </div>
          </div>
          <div class="settings-grid">
            <div class="setting-block">
              <label>Punkte zum Sieg (max 1000)</label>
              <input type="number" id="inp-points" class="input-field" min="1" max="1000" value="10" onchange="pushSettings()">
            </div>
          </div>
          <button onclick="startGame()" id="btn-start" class="btn btn-primary btn-full mt-4" disabled>Spiel starten</button>
          <p id="waiting-msg" style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:8px"></p>
        </div>
        <div id="settings-readonly" class="hidden" style="color:var(--text-dim);font-size:14px;text-align:center">
          Warte auf den Host...
        </div>
      </div>
    </div>

    <!-- ── Countdown ── -->
    <div class="screen" id="screen-countdown">
      <div style="text-align:center">
        <div style="font-size:16px;color:var(--text-dim);margin-bottom:8px">Spiel startet in…</div>
        <div class="countdown-number" id="countdown-num">3</div>
      </div>
    </div>

    <!-- ── Question ── -->
    <div class="screen" id="screen-question" style="justify-content:flex-start;padding-top:36px">
      <div style="width:100%;max-width:640px;margin-bottom:16px">
        <div class="timer-wrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span id="round-indicator" style="font-size:13px;color:var(--text-muted)"></span>
          <span id="timer-display" class="timer-display">--</span>
        </div>
      </div>

      <div id="category-label" class="kq-category hidden">Kategorie</div>
      <div id="reveal-banner" class="kq-reveal hidden"></div>
      <div id="question-text" class="kq-question" style="display:none">Frage lädt…</div>

      <div id="options-grid" class="options-grid hidden">
        <button class="option-btn" id="opt-0"><span class="option-letter">A</span><span class="option-text"></span></button>
        <button class="option-btn" id="opt-1"><span class="option-letter">B</span><span class="option-text"></span></button>
        <button class="option-btn" id="opt-2"><span class="option-letter">C</span><span class="option-text"></span></button>
        <button class="option-btn" id="opt-3"><span class="option-letter">D</span><span class="option-text"></span></button>
      </div>

      <div id="answer-row" class="answer-row hidden">
        <input id="answer-input" type="text" class="input-field" placeholder="Antwort eingeben…" autocomplete="off" autocorrect="off">
        <button id="btn-submit" class="btn btn-primary">Absenden</button>
      </div>
      <p id="typing-hint" class="typing-hint hidden">Erster richtiger Treffer gewinnt!</p>
      <div id="waiting-answers" style="display:none;margin-top:16px;color:var(--text-dim);font-size:14px;text-align:center"></div>
    </div>

    <!-- ── End ── -->
    <div class="screen" id="screen-end">
      <div class="winner-card" style="width:100%;max-width:480px">
        <p style="font-size:16px;color:var(--text-dim);margin-bottom:4px">Gewinner</p>
        <div class="winner-name" id="winner-name">---</div>
        <div class="final-scores" id="final-scores"></div>
        <div style="margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button id="btn-play-again" onclick="playAgain()" class="btn btn-primary">Nochmal spielen</button>
          <a href="/dashboard.html" class="btn btn-secondary">Zurück</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/socket-utils.js?v=2"></script>
<script src="/js/games/knowledge-quiz.js?v=2"></script>
</body>
</html>
